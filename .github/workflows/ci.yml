name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      PHP_DEBUG_VERSION: "1.40.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # version number from git describe

      - name: PHP with Xdebug and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer

      - name: Intelephense
        run: npm install -g intelephense

      - name: Phpactor (rename, implementations, code actions tests)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/phpactor" https://github.com/phpactor/phpactor/releases/latest/download/phpactor.phar
          chmod +x "$HOME/.local/bin/phpactor"

      - name: Debug adapter (vscode-php-debug)
        run: |
          curl -sSL -o "$RUNNER_TEMP/php-debug.vsix" \
            "https://github.com/xdebug/vscode-php-debug/releases/download/v$PHP_DEBUG_VERSION/php-debug-$PHP_DEBUG_VERSION.vsix"
          unzip -q "$RUNNER_TEMP/php-debug.vsix" -d "$RUNNER_TEMP/php-debug"
          echo "PHPIDE_PHP_DEBUG_JS=$RUNNER_TEMP/php-debug/extension/out/phpDebug.js" >> "$GITHUB_ENV"
          echo "PHPIDE_PHP_DEBUG_VSIX=$RUNNER_TEMP/php-debug.vsix" >> "$GITHUB_ENV"

      - name: Fixture projects (PHPUnit, PHPStan, Pint; Symfony Console)
        run: |
          composer install --no-interaction --no-progress --working-dir Tests/Fixtures/php-project
          echo "PHPIDE_PHPUNIT_PROJECT=$GITHUB_WORKSPACE/Tests/Fixtures/php-project" >> "$GITHUB_ENV"
          echo "PHPIDE_PHPSTAN_PROJECT=$GITHUB_WORKSPACE/Tests/Fixtures/php-project" >> "$GITHUB_ENV"
          composer install --no-interaction --no-progress --working-dir Tests/Fixtures/console-app
          echo "PHPIDE_CONSOLE_PROJECT=$GITHUB_WORKSPACE/Tests/Fixtures/console-app" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          swift --version
          php -v
          composer --version
          node --version
          which intelephense

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle PHPIDE.app
        run: ./scripts/bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: PHPIDE-app
          path: build/PHPIDE.zip
